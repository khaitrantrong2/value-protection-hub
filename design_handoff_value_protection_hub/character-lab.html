<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CharacterLab — Crew GLB Review</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/loaders/GLTFLoader.js": "https://unpkg.com/three@0.184.0/examples/jsm/loaders/GLTFLoader.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9"
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --cyan:#4FD9FF; --sp-gray:#92A3C7; --line:rgba(146,163,199,.18); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#04071a; color:#F4F7FF; font-family:'Outfit',system-ui,sans-serif; overflow:hidden; }
  #app { height:100dvh; display:flex; flex-direction:column; background:
      radial-gradient(1100px 640px at 82% -12%, rgba(31,156,213,.13), transparent 60%),
      radial-gradient(820px 560px at 6% 112%, rgba(179,136,255,.08), transparent 55%),
      linear-gradient(180deg,#071633 0%,#050b22 55%,#04071a 100%); }
  header { flex:none; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:14px clamp(16px,3vw,34px); border-bottom:1px solid rgba(146,163,199,.1); backdrop-filter:blur(12px); }
  .brand { display:flex; flex-direction:column; line-height:1; }
  .brand b { font-size:16px; font-weight:600; letter-spacing:-.01em; }
  .brand span { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.28em; color:var(--sp-gray); margin-top:5px; }
  .tabs { display:flex; gap:8px; }
  .tab { cursor:pointer; font-family:'Outfit'; font-weight:600; font-size:14px; padding:9px 20px; border-radius:999px; border:1px solid var(--line); background:transparent; color:#cdd8f0; display:flex; align-items:center; gap:9px; }
  .tab .dot { width:8px; height:8px; border-radius:2px; }
  .tab[aria-selected="true"] { background:rgba(79,217,255,.1); color:#fff; }
  .body { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 340px; }
  @media (max-width:820px){ .body{ grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto; } }
  .stage { position:relative; min-height:0; }
  canvas { display:block; position:absolute; inset:0; width:100%; height:100%; z-index:0; }
  .overlay { position:absolute; inset:0; z-index:3; display:grid; place-items:center; padding:24px; pointer-events:none; }
  .card { pointer-events:auto; max-width:440px; width:100%; border:1px solid rgba(79,217,255,.22); border-radius:20px; background:linear-gradient(180deg,rgba(10,26,60,.94),rgba(6,15,38,.96)); box-shadow:0 30px 80px -30px #000; padding:26px; text-align:center; }
  .card .em { width:52px;height:52px;margin:0 auto 14px; border-radius:14px; border:1px solid var(--line); display:grid; place-items:center; color:var(--cyan); }
  .card h3 { margin:0 0 8px; font-size:18px; font-weight:600; }
  .card p { margin:0 0 14px; font-size:13.5px; line-height:1.55; color:var(--sp-gray); }
  .path { font-family:'JetBrains Mono',monospace; font-size:12px; color:#bfe6f5; background:rgba(79,217,255,.06); border:1px solid var(--line); border-radius:8px; padding:9px 12px; word-break:break-all; }
  .spin { width:38px;height:38px;border-radius:50%;border:3px solid rgba(79,217,255,.2);border-top-color:var(--cyan);animation:sp .8s linear infinite;margin:0 auto 14px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .side { border-left:1px solid var(--line); overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:20px; background:rgba(6,15,38,.5); }
  @media (max-width:820px){ .side{ border-left:0; border-top:1px solid var(--line); max-height:44dvh; } }
  .grp h4 { margin:0 0 10px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.2em; color:var(--sp-gray); }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  .btn { cursor:pointer; font-family:'Outfit'; font-weight:600; font-size:12.5px; padding:8px 13px; border-radius:9px; border:1px solid var(--line); background:transparent; color:#cdd8f0; }
  .btn[aria-pressed="true"], .btn.active { background:rgba(79,217,255,.12); border-color:rgba(79,217,255,.45); color:#fff; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  select { width:100%; font-family:'Outfit'; font-size:13px; padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:rgba(7,22,51,.6); color:#F4F7FF; }
  select:disabled { opacity:.4; }
  .toggle { display:flex; align-items:center; justify-content:space-between; padding:8px 0; font-size:13.5px; color:#dbe4f7; }
  .sw { width:40px;height:22px;border-radius:999px;border:1px solid var(--line);background:rgba(7,22,51,.6);position:relative;cursor:pointer;flex:none; }
  .sw::after { content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8ea3c9;transition:transform .18s,background .18s; }
  .sw[aria-checked="true"]{ background:rgba(79,217,255,.25);border-color:rgba(79,217,255,.5); }
  .sw[aria-checked="true"]::after{ transform:translateX(18px);background:var(--cyan); }
  .meta { display:flex; flex-direction:column; gap:1px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .meta div { display:flex; justify-content:space-between; gap:12px; padding:10px 13px; background:rgba(9,22,52,.7); font-size:12.5px; }
  .meta .k { color:var(--sp-gray); }
  .meta .v { color:#e4ebfb; font-family:'JetBrains Mono',monospace; text-align:right; }
  .anim-list { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-family:'JetBrains Mono',monospace; font-size:10px; padding:4px 9px; border-radius:6px; border:1px solid var(--line); color:#9fb0d3; }
  .chip.ok { color:#8EDAB2; border-color:rgba(142,218,178,.35); }
  .chip.miss { color:#ED6A88; border-color:rgba(237,106,136,.35); }
  a.link { color:var(--cyan); font-size:12.5px; text-decoration:none; }
  a.link:hover { color:#fff; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>CharacterLab</b><span>CREW GLB · REVIEW ENVIRONMENT</span></div>
    <div class="tabs" role="tablist" aria-label="Crew member">
      <button class="tab" role="tab" data-char="khai" aria-selected="true"><span class="dot" style="background:#35D6FF;box-shadow:0 0 8px #35D6FF"></span>Khải · Commander</button>
      <button class="tab" role="tab" data-char="lan" aria-selected="false"><span class="dot" style="background:#B388FF;box-shadow:0 0 8px #B388FF"></span>Lan · R2R Lead</button>
    </div>
    <a class="link" href="ASSET_CONTRACT.md" target="_blank">Asset contract ↗</a>
  </header>

  <div class="body">
    <div class="stage">
      <canvas id="c"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>

    <aside class="side">
      <div class="grp">
        <h4>CAMERA</h4>
        <div class="row" id="presets">
          <button class="btn active" data-view="front" disabled>Front</button>
          <button class="btn" data-view="threequarter" disabled>3-Quarter</button>
          <button class="btn" data-view="side" disabled>Side</button>
          <button class="btn" data-view="back" disabled>Back</button>
        </div>
      </div>
      <div class="grp">
        <h4>DISPLAY</h4>
        <div class="toggle">Wireframe <span class="sw" id="tg-wire" role="switch" aria-checked="false" tabindex="0"></span></div>
        <div class="toggle">Skeleton <span class="sw" id="tg-skel" role="switch" aria-checked="false" tabindex="0"></span></div>
        <div class="toggle">Ground grid <span class="sw" id="tg-grid" role="switch" aria-checked="true" tabindex="0"></span></div>
      </div>
      <div class="grp">
        <h4>ANIMATION</h4>
        <select id="animSel" disabled><option>— no clips —</option></select>
      </div>
      <div class="grp">
        <h4>INSPECTION</h4>
        <div class="meta">
          <div><span class="k">Triangles</span><span class="v" id="m-tris">—</span></div>
          <div><span class="k">Meshes</span><span class="v" id="m-meshes">—</span></div>
          <div><span class="k">Materials</span><span class="v" id="m-mats">—</span></div>
          <div><span class="k">Textures</span><span class="v" id="m-texs">—</span></div>
          <div><span class="k">Max texture</span><span class="v" id="m-texmax">—</span></div>
          <div><span class="k">Download size</span><span class="v" id="m-size">—</span></div>
        </div>
      </div>
      <div class="grp">
        <h4>REQUIRED CLIPS</h4>
        <div class="anim-list" id="clipReport">
          <span class="chip">Idle</span><span class="chip">Wave</span><span class="chip">Salute</span><span class="chip">Point</span>
        </div>
      </div>
      <div class="grp">
        <h4>MATERIALS</h4>
        <div class="anim-list" id="matReport"><span class="chip">—</span></div>
      </div>
    </aside>
  </div>
</div>
<script type="module" src="./character-lab.js"></script>
</body>
</html>
