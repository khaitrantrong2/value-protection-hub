<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @keyframes vphBreath { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5%); } }
  @keyframes vphBlink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }
  @keyframes vphAccOrbit { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6%) rotate(4deg); } }
  @media (prefers-reduced-motion: reduce) { .vph-astro *, .vph-astro { animation: none !important; } }
</style>
</helmet>
<div class="vph-astro" style="width:100%; height:100%; display:grid; place-items:center; overflow:visible;">
  <svg viewBox="0 0 140 190" fill="none" style="width:100%; height:100%; overflow:visible; display:block; animation:vphBreath 4.4s var(--ease-in-out,ease-in-out) infinite; animation-delay:{{ delay }}; transform-origin:50% 100%; filter:drop-shadow(0 10px 16px rgba(0,0,0,.45));">
    <!-- grounding halo -->
    <ellipse cx="70" cy="180" rx="34" ry="7" fill="{{ accent }}" opacity="0.16"></ellipse>

    <!-- backpack -->
    <rect x="44" y="74" width="52" height="60" rx="18" fill="{{ secondary }}"></rect>
    <rect x="50" y="82" width="8" height="30" rx="4" fill="{{ accent }}" opacity="0.9"></rect>
    <rect x="82" y="82" width="8" height="30" rx="4" fill="{{ accent }}" opacity="0.55"></rect>

    <!-- command antenna / back unit -->
    <sc-if value="{{ crestAntenna }}" hint-placeholder-val="{{ false }}">
      <line x1="96" y1="70" x2="106" y2="44" stroke="{{ secondary }}" stroke-width="3" stroke-linecap="round"></line>
      <circle cx="107" cy="41" r="4.5" fill="{{ accent }}"></circle>
      <circle cx="107" cy="41" r="8" fill="{{ accent }}" opacity="0.25"></circle>
    </sc-if>

    <!-- legs + boots -->
    <rect x="52" y="128" width="14" height="42" rx="7" fill="{{ secondary }}"></rect>
    <rect x="74" y="128" width="14" height="42" rx="7" fill="{{ secondary }}"></rect>
    <rect x="49" y="162" width="20" height="12" rx="5" fill="{{ accent }}"></rect>
    <rect x="71" y="162" width="20" height="12" rx="5" fill="{{ accent }}"></rect>

    <!-- arms + gloves -->
    <rect x="30" y="86" width="16" height="46" rx="8" fill="{{ primary }}"></rect>
    <rect x="94" y="86" width="16" height="46" rx="8" fill="{{ primary }}"></rect>
    <circle cx="38" cy="132" r="9" fill="{{ accent }}"></circle>
    <circle cx="102" cy="132" r="9" fill="{{ accent }}"></circle>

    <!-- torso: broad for M, tapered for F -->
    <sc-if value="{{ isF }}" hint-placeholder-val="{{ false }}">
      <path d="M46 82 q24 -8 48 0 l-6 52 q-18 7 -36 0 z" fill="{{ primary }}"></path>
    </sc-if>
    <sc-if value="{{ isM }}" hint-placeholder-val="{{ true }}">
      <rect x="42" y="80" width="56" height="58" rx="22" fill="{{ primary }}"></rect>
    </sc-if>
    <!-- torso sheen -->
    <path d="M54 88 q16 -5 32 0 l-2 12 q-14 -4 -28 0 z" fill="#ffffff" opacity="0.10"></path>
    <!-- emissive chest line -->
    <path d="M58 104 l12 -7 l12 7 M58 114 l12 -7 l12 7" stroke="{{ accent }}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"></path>
    <!-- collar -->
    <rect x="56" y="74" width="28" height="9" rx="4.5" fill="{{ accent }}"></rect>

    <!-- rank insignia -->
    <sc-if value="{{ isCommander }}" hint-placeholder-val="{{ false }}">
      <path d="M70 120 l3.6 7.4 l8 .7 l-6 5.2 l1.9 7.9 l-7.5 -4.4 l-7.5 4.4 l1.9 -7.9 l-6 -5.2 l8 -.7 z" fill="{{ accent }}"></path>
    </sc-if>
    <sc-if value="{{ isLead }}" hint-placeholder-val="{{ false }}">
      <path d="M70 121 l8 4.6 v9.2 l-8 4.6 l-8 -4.6 v-9.2 z" fill="none" stroke="{{ accent }}" stroke-width="2.4"></path>
      <circle cx="70" cy="130" r="2.6" fill="{{ accent }}"></circle>
    </sc-if>
    <sc-if value="{{ isCadet }}" hint-placeholder-val="{{ false }}">
      <circle cx="70" cy="129" r="7.5" fill="none" stroke="{{ accent }}" stroke-width="2.4" stroke-dasharray="3 3"></circle>
    </sc-if>

    <!-- HELMET -->
    <circle cx="70" cy="46" r="38" fill="{{ primary }}"></circle>
    <circle cx="70" cy="46" r="38" fill="#ffffff" opacity="0.06"></circle>
    <!-- hair behind visor (top of head) -->
    <sc-if value="{{ crestBun }}" hint-placeholder-val="{{ false }}">
      <circle cx="70" cy="12" r="9" fill="{{ hair }}"></circle>
    </sc-if>
    <!-- glass visor -->
    <circle cx="70" cy="46" r="30" fill="#091634"></circle>
    <circle cx="70" cy="46" r="30" fill="{{ visorTint }}" opacity="0.22"></circle>
    <!-- hair fringe inside visor top -->
    <sc-if value="{{ crestSide }}" hint-placeholder-val="{{ false }}">
      <path d="M44 34 q-6 -20 20 -26 q-6 12 -3 26 z" fill="{{ hair }}"></path>
    </sc-if>
    <sc-if value="{{ crestMohawk }}" hint-placeholder-val="{{ false }}">
      <path d="M60 22 Q70 0 80 22 q-10 -5 -20 0 z" fill="{{ hair }}"></path>
    </sc-if>
    <!-- face: expressive eyes -->
    <g style="transform-origin:70px 48px; animation:vphBlink 6.5s ease-in-out infinite; animation-delay:{{ delay }};">
      <ellipse cx="60" cy="46" rx="4.6" ry="6" fill="#eef6ff"></ellipse>
      <ellipse cx="80" cy="46" rx="4.6" ry="6" fill="#eef6ff"></ellipse>
      <circle cx="60.6" cy="47" r="2.8" fill="{{ eyeColor }}"></circle>
      <circle cx="80.6" cy="47" r="2.8" fill="{{ eyeColor }}"></circle>
      <circle cx="61.6" cy="45.6" r="1.1" fill="#ffffff"></circle>
      <circle cx="81.6" cy="45.6" r="1.1" fill="#ffffff"></circle>
    </g>
    <!-- cheeks + smile -->
    <ellipse cx="54" cy="55" rx="3.2" ry="2" fill="{{ accent }}" opacity="0.4"></ellipse>
    <ellipse cx="86" cy="55" rx="3.2" ry="2" fill="{{ accent }}" opacity="0.4"></ellipse>
    <path d="M64 56 q6 5 12 0" stroke="#cfe0ff" stroke-width="1.8" fill="none" stroke-linecap="round"></path>
    <!-- visor emissive trim + gloss -->
    <circle cx="70" cy="46" r="30" stroke="{{ accent }}" stroke-width="2" fill="none" opacity="0.5"></circle>
    <path d="M52 30 a30 30 0 0 1 20 -10" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.35" fill="none"></path>
    <path d="M50 52 q10 12 26 10" stroke="#ffffff" stroke-width="3" opacity="0.12" fill="none" stroke-linecap="round"></path>
    <!-- helmet rim highlight -->
    <path d="M40 34 a38 38 0 0 1 22 -20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4" fill="none"></path>

    <!-- ROLE ACCESSORY -->
    <g style="transform-origin:112px 96px; animation:vphAccOrbit 5s var(--ease-in-out,ease-in-out) infinite; animation-delay:{{ delay }};">
      <sc-if value="{{ accWrist }}" hint-placeholder-val="{{ false }}">
        <rect x="26" y="120" width="18" height="13" rx="3.5" fill="#0a1836" stroke="{{ accent }}" stroke-width="1.6"></rect>
        <rect x="29" y="123" width="12" height="3" rx="1.5" fill="{{ accent }}"></rect>
        <rect x="29" y="128" width="8" height="2.4" rx="1.2" fill="{{ accent }}" opacity="0.7"></rect>
      </sc-if>
      <sc-if value="{{ accBaton }}" hint-placeholder-val="{{ false }}">
        <rect x="100" y="96" width="24" height="17" rx="4" fill="#0a1836" stroke="{{ accent }}" stroke-width="1.6"></rect>
        <rect x="104" y="100" width="16" height="2.6" rx="1.3" fill="{{ accent }}"></rect>
        <rect x="104" y="105" width="11" height="2.6" rx="1.3" fill="{{ accent }}" opacity="0.7"></rect>
      </sc-if>
      <sc-if value="{{ accShield }}" hint-placeholder-val="{{ false }}">
        <path d="M112 92 l14 5 v10 q0 9 -14 14 q-14 -5 -14 -14 v-10 z" fill="{{ accent }}" opacity="0.2" stroke="{{ accent }}" stroke-width="1.8"></path>
        <path d="M105 104 l5 5 l10 -10" stroke="{{ accent }}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      </sc-if>
      <sc-if value="{{ accMonocle }}" hint-placeholder-val="{{ false }}">
        <circle cx="84" cy="46" r="9" fill="none" stroke="{{ accent }}" stroke-width="2"></circle>
        <line x1="91" y1="42" x2="98" y2="38" stroke="{{ accent }}" stroke-width="2" stroke-linecap="round"></line>
        <circle cx="84" cy="46" r="9" fill="{{ accent }}" opacity="0.14"></circle>
      </sc-if>
      <sc-if value="{{ accComms }}" hint-placeholder-val="{{ false }}">
        <line x1="100" y1="88" x2="112" y2="66" stroke="{{ accent }}" stroke-width="2.4" stroke-linecap="round"></line>
        <circle cx="113" cy="63" r="4" fill="{{ accent }}"></circle>
        <path d="M108 60 a10 10 0 0 1 10 6" stroke="{{ accent }}" stroke-width="1.6" fill="none" opacity="0.7"></path>
      </sc-if>
      <sc-if value="{{ accScanner }}" hint-placeholder-val="{{ false }}">
        <circle cx="112" cy="96" r="12" fill="none" stroke="{{ accent }}" stroke-width="2"></circle>
        <circle cx="112" cy="96" r="5" fill="{{ accent }}" opacity="0.5"></circle>
        <circle cx="112" cy="96" r="12" fill="{{ accent }}" opacity="0.1"></circle>
      </sc-if>
      <sc-if value="{{ accUtility }}" hint-placeholder-val="{{ false }}">
        <rect x="102" y="98" width="16" height="16" rx="3.5" fill="#0a1836" stroke="{{ accent }}" stroke-width="1.6"></rect>
        <path d="M106 106 h8 M110 102 v8" stroke="{{ accent }}" stroke-width="2" stroke-linecap="round"></path>
      </sc-if>
      <sc-if value="{{ accDrone }}" hint-placeholder-val="{{ false }}">
        <rect x="102" y="86" width="20" height="14" rx="4" fill="#0a1836" stroke="{{ accent }}" stroke-width="1.6"></rect>
        <circle cx="107" cy="93" r="2.4" fill="{{ accent }}"></circle>
        <rect x="112" y="90" width="7" height="2.4" rx="1.2" fill="{{ accent }}"></rect>
        <rect x="112" y="94" width="5" height="2" rx="1" fill="{{ accent }}" opacity="0.7"></rect>
      </sc-if>
      <sc-if value="{{ accDualPod }}" hint-placeholder-val="{{ false }}">
        <circle cx="26" cy="98" r="9" fill="{{ accent }}" opacity="0.22" stroke="{{ accent }}" stroke-width="1.6"></circle>
        <circle cx="114" cy="98" r="9" fill="{{ secondary }}" opacity="0.5" stroke="{{ accent }}" stroke-width="1.6"></circle>
        <text x="26" y="101" font-family="monospace" font-size="7" fill="{{ accent }}" text-anchor="middle">PH</text>
        <text x="114" y="101" font-family="monospace" font-size="7" fill="{{ accent }}" text-anchor="middle">ID</text>
      </sc-if>
      <sc-if value="{{ accNotebook }}" hint-placeholder-val="{{ false }}">
        <rect x="100" y="92" width="18" height="20" rx="3" fill="#0a1836" stroke="{{ accent }}" stroke-width="1.6"></rect>
        <path d="M104 98 h10 M104 102 h10 M104 106 h7" stroke="{{ accent }}" stroke-width="1.4" stroke-linecap="round"></path>
        <path d="M109 88 l2 3 h-4 z" fill="{{ accent }}"></path>
      </sc-if>
    </g>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:210},&quot;primary&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#35D6FF&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondary&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0B2A5B&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFC857&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;gender&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;M&quot;,&quot;options&quot;:[&quot;M&quot;,&quot;F&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;rank&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;commander&quot;,&quot;options&quot;:[&quot;commander&quot;,&quot;lead&quot;,&quot;guardian&quot;,&quot;cadet&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;crest&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;antenna&quot;,&quot;options&quot;:[&quot;antenna&quot;,&quot;bun&quot;,&quot;side&quot;,&quot;mohawk&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;accessory&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;wrist&quot;,&quot;options&quot;:[&quot;wrist&quot;,&quot;baton&quot;,&quot;shield&quot;,&quot;monocle&quot;,&quot;comms&quot;,&quot;scanner&quot;,&quot;utility&quot;,&quot;drone&quot;,&quot;dualpod&quot;,&quot;notebook&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;hair&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2a1f16&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;delay&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0s&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const rank = p.rank || 'guardian';
    const acc = p.accessory || '';
    const gender = p.gender || 'M';
    const crest = p.crest || 'side';
    return {
      primary: p.primary || '#35D6FF',
      secondary: p.secondary || '#0B2A5B',
      accent: p.accent || '#FFC857',
      visorTint: p.primary || '#35D6FF',
      eyeColor: p.secondary || '#0B2A5B',
      hair: p.hair || '#2a1f16',
      delay: p.delay || '0s',
      isF: gender === 'F',
      isM: gender !== 'F',
      isCommander: rank === 'commander',
      isLead: rank === 'lead',
      isGuardian: rank === 'guardian',
      isCadet: rank === 'cadet',
      crestBun: crest === 'bun',
      crestSide: crest === 'side',
      crestMohawk: crest === 'mohawk',
      crestAntenna: crest === 'antenna' || rank === 'commander',
      accWrist: acc === 'wrist',
      accBaton: acc === 'baton',
      accShield: acc === 'shield',
      accMonocle: acc === 'monocle',
      accComms: acc === 'comms',
      accScanner: acc === 'scanner',
      accUtility: acc === 'utility',
      accDrone: acc === 'drone',
      accDualPod: acc === 'dualpod',
      accNotebook: acc === 'notebook',
    };
  }
}
</script>
</body>
</html>
